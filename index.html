<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Night City Trainer</title>
    <script>
      // Theme before first paint (no flash): saved choice in localStorage 'nct.theme', else the system's.
      // data-theme always holds the resolved theme; the header toggle in src/App.tsx changes it.
      (function () {
        var root = document.documentElement;
        var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
        function saved() {
          try {
            var t = localStorage.getItem('nct.theme');
            return t === 'light' || t === 'dark' ? t : '';
          } catch (e) {
            return '';
          }
        }
        function apply() {
          root.setAttribute('data-theme', saved() || (mq && mq.matches ? 'dark' : 'light'));
        }
        apply();
        if (mq && mq.addEventListener) mq.addEventListener('change', apply);
        // the look from the board settings (src/lib/boardSettings.ts): accent, card back, glow, frame, numerals and
        // motion; src/ui/useBoardSettings.ts (applyLook) sets the same attributes later and changes them. A field the
        // visitor never saved takes the site config's default (play.board in the config the build inlines above as
        // #nct-site-config, vite.config.ts). The accent of settings saved without one is yellow, as it always was.
        var bs = null;
        var site = {};
        try {
          bs = JSON.parse(localStorage.getItem('nct.boardSettings.v1') || 'null');
        } catch (e) {
          /* no settings, or storage blocked */
        }
        try {
          var sc = document.getElementById('nct-site-config');
          var cfg = sc ? JSON.parse(sc.textContent || 'null') : null;
          if (cfg && cfg.play && cfg.play.board) site = cfg.play.board;
        } catch (e) {
          /* no inlined config: the defaults */
        }
        function look(k, d) {
          var v = bs && typeof bs[k] === 'string' ? bs[k] : site && typeof site[k] === 'string' ? site[k] : d;
          return /^[a-z-]+$/.test(v) ? v : d;
        }
        var accent = bs && typeof bs === 'object' ? (typeof bs.accent === 'string' ? bs.accent : 'yellow') : look('accent', 'yellow');
        if (/^[a-z]+$/.test(accent) && accent !== 'yellow') root.setAttribute('data-accent', accent);
        root.setAttribute('data-card-back', look('cardBack', 'stripes'));
        root.setAttribute('data-glow', look('glow', 'soft'));
        root.setAttribute('data-frame', look('frame', 'hud'));
        root.setAttribute('data-numerals', look('numerals', 'readout'));
        var motion = bs && typeof bs.motion === 'string' ? bs.motion : 'system';
        var mm = function (q) {
          return !!(window.matchMedia && window.matchMedia(q).matches);
        };
        var level = motion === 'full' || motion === 'reduced' || motion === 'off' ? motion : mm('(prefers-reduced-motion: reduce)') ? 'off' : 'full';
        var ambient = motion === 'full' || (motion !== 'reduced' && motion !== 'off' && level === 'full' && mm('(hover: hover) and (pointer: fine)'));
        root.setAttribute('data-motion', level);
        root.setAttribute('data-ambient', ambient ? 'on' : 'off');
      })();
    </script>
    <meta name="description" content="Unofficial Cyberpunk TCG practice simulator: deck builder, meta, guides, bot battles and matchup lab." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23fcee0a'/><text x='16' y='23' font-size='18' text-anchor='middle' font-family='monospace' font-weight='bold'>NC</text></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
