name: Check and deploy to GitHub Pages

# `check` runs on every push and pull request: install, typecheck, test, lint, the recorded-data consistency check and
# the production build. On a push to main it also uploads dist/ as the Pages artifact, so the bytes that deploy are the
# bytes that passed the checks.
# `deploy` runs only for pushes to main, after `check` passes, and publishes that artifact with GitHub's official
# Pages actions. It runs no repository code, and it alone holds `pages: write` and `id-token: write`.
#
# Needs the repository's Pages source set to "GitHub Actions" (Settings → Pages → Build and deployment → Source);
# see docs/ROADMAP.md §2. Every push to main is a release for now; a manual or tagged release is still an open decision.
#
# Actions are pinned to the full commit SHA of the tag named in the trailing comment.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # tsc -b over the split tsconfigs, plus noUncheckedIndexedAccess for src/lib and src/analysis
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run lint
      - run: npm run check:data
      # `npm run build` would typecheck a second time; it already ran above.
      - run: npx vite build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    needs: check
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deploy at a time; never cancel one that is already publishing, queue the next instead.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
